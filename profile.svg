<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title">
  <title id="title">Ilham Sikumbang, Fullstack developer · Indonesia. From pixels to pins. Stack: Interface (TypeScript, React, Next.js, Tailwind, Vite); Server (PHP, Laravel, Node.js, MySQL, PostgreSQL); Vision (Python, OpenCV, MediaPipe, NumPy); Device (C++, Arduino, ESP32, MQTT). Most recent push: Porto, pushed 5 days ago.</title>
  <defs>
    
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0 0.07  0.55 0 0 0 -0.193"/>
    </filter>
    
    <style>
      .serif{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif}
      .mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace}
      .caps{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes travel{0%{transform:translateY(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateY(252px);opacity:0}}
      .pulse-dot{animation:travel 3.9s cubic-bezier(.45,0,.55,1) infinite;opacity:0}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
      .led0{animation:blink 2.2s steps(2,jump-none) infinite}
      .led1{animation:blink 3.1s steps(2,jump-none) infinite}
      .led2{animation:blink 1.7s steps(2,jump-none) infinite}
      .led3{animation:blink 2.7s steps(2,jump-none) infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  
