name: Generate Animation

on:
  # run automatically every hour so the README stats and sky chart stay current
  schedule:
    - cron: "0 * * * *"
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the master branch
  push:
    branches:
    - master
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4

      # builds dist/contribution-stats(-dark).svg and dist/contribution-sky(-dark).svg from the GitHub API
      - name: generate contribution stats cards
        run: node .github/scripts/contrib-card.mjs Oqexip dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # draws dist/sky(-dark).svg: the real sky over Indonesia at the moment this runs
      - name: generate live sky chart
        run: node .github/scripts/sky.mjs dist

      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Oqexip
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
